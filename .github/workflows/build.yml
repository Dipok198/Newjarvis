name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o "$(ls jarvis-android-main*.zip | head -n 1)" -d build_dir

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Hey Jarvis wake word models (personal use only)
        working-directory: build_dir/jarvis-android-main
        run: |
          mkdir -p app/src/debug/assets/wake
          cd app/src/debug/assets/wake
          B=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fL --retry 3 -o "$f" "$B/$f" || { echo "WARNING: could not download $f"; rm -f "$f"; }
          done
          ls -la

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Build debug APK
        working-directory: build_dir/jarvis-android-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          files: build_dir/jarvis-android-main/app/build/outputs/apk/debug/app-debug.apk
