cat > .github/workflows/build.yml << 'EOF'
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SHILEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SHILEX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SHILEX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SHILEX_KEYSTORE_PASSWORD: ${{ secrets.SHILEX_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK (no signing key)
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/JARVIS-release.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist/JARVIS-debug.apk
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
EOF
